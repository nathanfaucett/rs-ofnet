<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@ofnet/net — Browser Mesh Example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      .endpoint { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      .endpoint h2 { font-size: 1rem; margin: 0 0 0.5rem; }
      .id { font-family: monospace; font-size: 0.75rem; color: #666; word-break: break-all; }
      button { margin-right: 0.5rem; margin-top: 0.5rem; padding: 0.25rem 0.75rem; cursor: pointer; }
      #log { background: #f5f5f5; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
  </head>
  <body>
    <h1>@ofnet/net — Two browser endpoints in one page</h1>
    <p>Both endpoints connect through public n0 relays. Alice broadcasts; Bob receives.</p>

    <div class="endpoint" id="alice-box">
      <h2>Alice</h2>
      <div class="id" id="alice-id">connecting…</div>
      <button id="alice-broadcast">Broadcast "Hello from Alice!"</button>
    </div>

    <div class="endpoint" id="bob-box">
      <h2>Bob</h2>
      <div class="id" id="bob-id">connecting…</div>
      <button id="bob-send">Send direct to Alice</button>
    </div>

    <h2>Message log</h2>
    <div id="log"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
